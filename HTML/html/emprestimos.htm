<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimo</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsivos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Borel&family=DM+Serif+Text:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logo.png">
</head>
<body>
    <header>
        <div class="ordena">
            <img src="../img/logo.png" alt="bibliosesi logo">
            <h1>Biblioteca Virtual</h1>
            <i class="fa-solid fa-bars bt-menu"></i>
        </div>
    </header>
    <div class="navegar">
        <nav>
            <ul>
                <div class="nav-links">
                    <i class="fa-solid fa-house"></i><li><a href="inicial.htm">Início</li></a>
                </div>
                <div class="nav-links">
                    <i class="fa-solid fa-circle-user"></i><li><a href="perfil.htm">Perfil do Usuáro</li></a>
                </div>
                <div class="nav-links">
                    <i class="fa-solid fa-folder-open"></i><li><a href="emprestimos.htm">Empréstimos</li></a>
                </div>
                <div class="nav-links">
                    <i class="fa-solid fa-book"></i><li><a href="catalogo.htm">Catálogo</li></a>
                </div>
                <div class="bt-sair">
                    <button><a href="index.htm">Sair <i class="fa-solid fa-right-to-bracket"></i></a></button>
                </div>
            </ul>
        </nav>
    </div>

    <main>
        <div class="emprestimo-grid">
            <div class="emp-lista">
                <div class="emp-lista-grid">
                    <div class="emp-livro">
                        <div class="emp-livro-img">
                            <img src="" alt="">
                        </div>
                        <div class="emp-livro-info">
                            <h5>O Pequeno Príncipe</h5>
                            <p>Antoine de Saint-Exupéry</p>
                            <span>Em posse</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="emp-detalhes">
                <div class="det-text">Clique em um livro para ver detalhes</div>
            </div>
            <div class="det-infos">
                <div class="det-up">
                    <div class="det-img">
                        <img src="" alt="">
                    </div>
                    <div class="det-desc">
                        <h3></h3>
                        <p></p>
                    </div>
                </div>
                <div class="det-down">
                    <div class="det-left">
                        <h3>Avalie o livro</h3>
                        
                    </div>
                    <div class="det-right">

                    </div>
                </div>
            </div>
        </div>
    </main>
    
</body>
<script src="../script.js"></script>
</html>
